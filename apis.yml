name: ClearBank
kind: company
description: >-
  ClearBank is a UK clearing and Banking-as-a-Service bank, founded in 2015 by
  Nick Ogden (founder of WorldPay) and Charles McManus and granted a banking
  licence in December 2016 as the first new UK clearing bank in more than 250
  years. ClearBank Limited is authorised by the Prudential Regulation Authority
  and regulated by the Financial Conduct Authority and the Prudential Regulation
  Authority (FRN 754568), with a European subsidiary, ClearBank Europe N.V.,
  authorised by the European Central Bank. It is privately owned, backed by Apax
  Partners and PPF Group. Built cloud-native on Microsoft Azure, ClearBank is a
  direct participant in the UK payment schemes (Faster Payments, CHAPS, Bacs)
  and offers Agency Banking, Embedded Banking, and Transaction Banking to banks,
  fintechs, and corporates through a single proprietary JSON REST API. Unlike
  the CMA9 retail banks, ClearBank is not a mandated Open Banking ASPSP and does
  not publish the OBIE Open Data (ATMs/Branches/Products) or OBIE Read/Write
  (AISP/PISP/CBPII) APIs; its public developer surface is the token-authenticated,
  RSA-signed ClearBank Financial Institutions API covering GBP accounts and
  payments, multi-currency accounts, FX, SEPA, cross-border payments,
  Confirmation of Payee, customer due diligence (KYC), and embedded/retail
  banking, with a full simulation environment for onboarding.
