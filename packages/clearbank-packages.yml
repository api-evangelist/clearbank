source: https://github.com/clearbank
note: >-
  ClearBank does not distribute a packaged, general-purpose client SDK on a
  language registry. Its first-party GitHub repos are request-signing helper
  libraries / examples (the DigitalSignature RSA flow) plus a Postman collection
  and a worked end-to-end example. The only registry-published client wrapper
  (ClearBank.Net on NuGet) is a community project, not first-party.
packages:
